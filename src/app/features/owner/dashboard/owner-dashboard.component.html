<h1>Your pet care, in one place</h1><p>Welcome to your pet owner portal.</p><div class="stats"><app-stat-card label="Pets" [value]="pets.pets.length.toString()" hint="Your profiles"/><app-stat-card label="Appointments" [value]="appointments.appointments.length.toString()" hint="All requests"/><app-stat-card label="Pending" [value]="pending.toString()" hint="Awaiting clinic"/></div><a class="primary" routerLink="/owner/book-appointment">＋ Book appointment</a><section class="card"><h3>Recent appointments</h3><p *ngFor="let a of appointments.appointments">{{a.petName}} · {{a.reason}} · {{a.date}} <app-status-badge [status]="a.status"/></p></section>
