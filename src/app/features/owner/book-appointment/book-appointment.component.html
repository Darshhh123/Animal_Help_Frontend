<h1>Book an appointment</h1><section class="card form-card"><form (ngSubmit)="book()"><label>Pet</label><select [(ngModel)]="petId" name="pet"><option *ngFor="let p of pets.pets" [value]="p.id">{{p.name}} · {{p.species}}</option></select><label>Reason for visit</label><input [(ngModel)]="reason" name="reason" required placeholder="Vaccination, check-up..."><label>Date</label><input type="date" [(ngModel)]="date" name="date" [min]="today" required><label>Time</label><input type="time" [(ngModel)]="time" name="time" required><button class="primary">Submit request</button></form><p>Or use the <a routerLink="/owner/ai-assistant">AI assistant</a> for guided booking instructions.</p></section>
