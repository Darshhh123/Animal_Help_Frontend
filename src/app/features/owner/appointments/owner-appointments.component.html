<h1>My appointments</h1><section class="card"><div class="table-wrap"><table><tr><th>Pet</th><th>Reason</th><th>Date/time</th><th>Source</th><th>Status</th></tr><tr *ngFor="let a of appointments.appointments"><td>{{a.petName}}</td><td>{{a.reason}}</td><td>{{a.date}} {{a.time}}</td><td>{{a.bookingSource}}</td><td><app-status-badge [status]="a.status"/></td></tr></table></div></section>
