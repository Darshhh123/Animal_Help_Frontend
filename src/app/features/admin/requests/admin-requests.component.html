<h1>Appointment requests</h1><section class="card"><div class="table-wrap"><table><tr><th>Pet/owner</th><th>Reason</th><th>Date/time</th><th>Source</th><th>Status</th><th>Action</th></tr><tr *ngFor="let a of appointments.appointments"><td>{{a.petName}} / {{a.ownerName}}</td><td>{{a.reason}}</td><td>{{a.date}} {{a.time}}</td><td>{{a.bookingSource}}</td><td><app-status-badge [status]="a.status"/></td><td><button *ngIf="a.status==='PENDING'" (click)="approve(a.id)">Approve</button> <button *ngIf="a.status==='PENDING'" (click)="reject(a.id)">Reject</button></td></tr></table></div></section>
